name: test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # file: resource typing (lib.logResource).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends file
      - run: npm ci
      - run: npm test
